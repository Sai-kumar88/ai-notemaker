version: "3.8"

services:
  notemaker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notemaker-ai
    restart: unless-stopped
    ports:
      - "8052:8052"
    env_file:
      - .env
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8052
      - ENVIRONMENT=production
    volumes:
      # Persist user uploads across container rebuilds
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8052/api/v1/notes/info"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
